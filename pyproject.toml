[project]
name = "episteme-public-checks"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi==0.141.1", "httpx==0.28.1"]

[tool.ruff]
target-version = "py311"
exclude = [".venv", "tmp", "node_modules"]

[tool.ruff.lint]
select = ["F", "E9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
